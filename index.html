<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkllink</title>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#070707;color:white;}
.topbar{position:fixed;top:0;left:0;right:0;height:50px;background:#101010;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #222;z-index:10;cursor:pointer;}
.brand{color:#00ff66;font-weight:bold;}
#screen{position:absolute;top:50px;bottom:120px;left:0;right:0;overflow-y:auto;padding:10px;}
.msg{background:#141414;margin:8px 0;padding:10px;border-radius:12px;border-right:3px solid #00ff66;word-break:break-word;}
.input{position:fixed;bottom:60px;left:0;right:0;display:flex;padding:10px;background:#0f0f0f;border-top:1px solid #222;}
input{flex:1;padding:10px;border:none;border-radius:20px;background:#222;color:white;outline:none;}
button{margin-right:8px;background:#00ff66;border:none;border-radius:20px;padding:10px 14px;font-weight:bold;cursor:pointer;}
.nav{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;background:#0b0b0b;border-top:1px solid #222;}
.nav button{flex:1;background:none;border:none;color:white;font-size:20px;}
#login{position:fixed;inset:0;background:#070707;display:flex;align-items:center;justify-content:center;z-index:99999;}
.box{width:80%;background:#151515;padding:20px;border-radius:15px;text-align:center;}
#admin{position:fixed;top:55px;left:10px;background:#111;padding:10px;border:1px solid #333;display:none;z-index:9999;}
.secure-msg{font-size:0.75em;color:#666;margin-top:15px;padding-top:10px;border-top:1px solid #333;}
</style>
</head>
<body>

<div class="topbar" onclick="document.getElementById('admin').style.display='block'">
    <div class="brand">darkllink</div>
</div>

<div id="admin">
    <input id="code" placeholder="كود المطور">
    <button onclick="clearAll()">حذف الكل</button>
</div>

<div id="login">
    <div class="box">
        <h3>Login</h3>
        <input id="name" placeholder="اسمك">
        <button onclick="login()">دخول</button>
        <p class="secure-msg">نحن نحترم خصوصيتك. هذا الموقع لا يطلب أي معلومات شخصية، ولا يقوم بتسجيل أي بيانات خاصة بك.</p>
    </div>
</div>

<div id="screen"></div>

<div class="input">
    <input id="msg" placeholder="رسالة أو رابط">
    <button onclick="send()">➤</button>
</div>

<div class="nav">
    <button onclick="setMode('chat')">💬</button>
    <button onclick="setMode('links')">🔗</button>
</div>

<script>
firebase.initializeApp({databaseURL:"https://arenaproject-b78b8-default-rtdb.firebaseio.com"});
const db = firebase.database();
let user = localStorage.getItem("userName");
let mode = "chat";
const screen = document.getElementById("screen");

if(user) document.getElementById("login").style.display = "none";

function login(){
    let n = document.getElementById("name").value;
    user = n || "Anon-"+Math.floor(Math.random()*9999);
    localStorage.setItem("userName", user);
    document.getElementById("login").style.display = "none";
}

// دالة لمعالجة الروابط وتحويلها لأزرق
function linkify(text) {
    return text.replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/g, function(url) {
        let fullUrl = url.startsWith("http") ? url : "https://" + url;
        return `<a href="${fullUrl}" target="_blank" style="color:#007bff;text-decoration:underline;">${url}</a>`;
    });
}

db.ref("chat").limitToLast(50).on("child_added", snap=>{
    if(mode!=="chat") return;
    let d = snap.val();
    addMsg(d.user+" : "+d.msg);
});

db.ref("links").on("child_added", snap=>{
    if(mode!=="links") return;
    let d = snap.val();
    let div = document.createElement("div"); div.className = "msg";
    div.innerHTML = `<a href="${d.url}" target="_blank" style="color:#007bff;text-decoration:underline;">${d.url}</a>`;
    screen.appendChild(div);
    screen.scrollTop = screen.scrollHeight;
});

function send(){
    let m = document.getElementById("msg").value;
    if(!m) return;
    db.ref("chat").push({user, msg:m, time:Date.now()});
    if(/^(https?:\/\/|www\.)/i.test(m)) { 
        db.ref("links").push({url: m.startsWith("http") ? m : "https://"+m, user}); 
    }
    document.getElementById("msg").value = "";
}

function setMode(m){
    mode = m;
    screen.innerHTML = "";
    if(m === "chat"){
        db.ref("chat").limitToLast(50).once("value", s=>{
            s.forEach(x=>{ let d = x.val(); addMsg(d.user+" : "+d.msg); });
        });
    } else {
        db.ref("links").limitToLast(50).once("value", s=>{
            s.forEach(x=>{
                let d = x.val();
                let div = document.createElement("div"); div.className = "msg";
                div.innerHTML = `<a href="${d.url}" target="_blank" style="color:#007bff;text-decoration:underline;">${d.url}</a>`;
                screen.appendChild(div);
            });
        });
    }
}

function addMsg(text){
    let div = document.createElement("div"); div.className = "msg";
    let parts = text.split(" : ");
    let name = parts[0];
    let content = parts.slice(1).join(" : ");
    
    div.innerHTML = `<span style="color:#00ff66;font-weight:bold">${name}</span> : <span>${linkify(content)}</span>`;
    screen.appendChild(div);
    screen.scrollTop = screen.scrollHeight;
}

function clearAll(){
    if(document.getElementById("code").value === "153090"){
        db.ref("chat").remove(); db.ref("links").remove();
        location.reload();
    } else { alert("كود خاطئ"); }
}
</script>
</body>
  </html>
