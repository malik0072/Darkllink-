<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>darkllink</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        :root { --main: #00ff66; --bg: #0a0a0a; }
        body { margin:0; background: var(--bg); color: #fff; font-family: sans-serif; }
        .topbar { position:fixed; top:0; width:100%; height:50px; background:#000; display:flex; align-items:center; justify-content:space-between; padding:0 15px; border-bottom:1px solid #333; z-index:100; box-sizing:border-box; }
        .logo { color: var(--main); font-weight:bold; font-size:1.3em; letter-spacing:1px; }
        #screen { position:absolute; top:55px; bottom:120px; width:100%; overflow-y:auto; padding:10px; box-sizing:border-box; }
        .msg { background:#111; padding:12px; border-radius:10px; margin-bottom:10px; border-right:3px solid var(--main); }
        .chat-img { width:100px; height:100px; object-fit:cover; border-radius:8px; cursor:pointer; }
        .input-area { position:fixed; bottom:60px; width:100%; display:flex; padding:5px; background:#000; box-sizing:border-box; }
        .nav { position:fixed; bottom:0; width:100%; height:60px; background:#000; display:flex; border-top:1px solid #333; }
        .nav button { flex:1; background:none; border:none; color:#555; cursor:pointer; font-size:14px; }
        .nav button.active { color:var(--main); font-weight:bold; border-top:2px solid var(--main); }
        #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; }
        #toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--main); color:#000; padding:10px 20px; border-radius:20px; display:none; z-index:2000; font-weight:bold; }
    </style>
</head>
<body>

<div id="login" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div style="text-align:center;">
        <h2 style="color:var(--main)">darkllink</h2>
        <input id="uName" placeholder="أدخل اسمك..." style="padding:10px; border-radius:10px; border:none;">
        <button onclick="login()" style="padding:10px 20px; background:var(--main); border:none; border-radius:10px;">دخول</button>
    </div>
</div>

<div id="toast">تم نسخ الرابط!</div>

<div class="topbar">
    <div class="logo">darkllink</div>
    <div id="onlineCount" style="color:#555; font-size:12px;">المتصلون: 0</div>
</div>

<div id="screen"></div>

<div id="modal" onclick="this.style.display='none'">
    <img id="fullImg" style="max-width:95%; max-height:90%; border-radius:5px;">
</div>

<div class="input-area">
    <input type="file" id="imgFile" hidden onchange="sendImg(this)">
    <button onclick="document.getElementById('imgFile').click()">📷</button>
    <input id="msg" style="flex:1; background:#222; border:none; color:white; padding:10px; border-radius:20px; margin:0 5px;" placeholder="رسالة أو رابط...">
    <button onclick="sendMsg()" style="background:var(--main); padding:0 15px; border-radius:20px; border:none; font-weight:bold;">إرسال</button>
</div>

<div class="nav">
    <button id="btn-chat" class="active" onclick="setMode('chat')">الدردشة</button>
    <button id="btn-links" onclick="setMode('links')">الروابط</button>
</div>

<script>
firebase.initializeApp({databaseURL:"https://arenaproject-b78b8-default-rtdb.firebaseio.com"});
const db = firebase.database();

let user = JSON.parse(localStorage.getItem("d_user"));
if(user) {
    document.getElementById("login").style.display = "none";
    // تفعيل العداد
    let statusRef = db.ref('status/' + user.name);
    statusRef.onDisconnect().remove();
    statusRef.set(true);
}

function login() {
    let name = document.getElementById("uName").value;
    if(!name) return;
    localStorage.setItem("d_user", JSON.stringify({name: name}));
    location.reload();
}

db.ref('status').on('value', s => document.getElementById('onlineCount').innerText = "المتصلون: " + s.numChildren());

function sendMsg() {
    let input = document.getElementById("msg");
    let val = input.value;
    if(!val) return;
    db.ref("chat").push({ user: user.name, msg: val });
    if(val.startsWith("http")) {
        db.ref("links").push({ user: user.name, msg: val });
    }
    input.value = "";
}

function sendImg(input) {
    let reader = new FileReader();
    reader.onload = (e) => db.ref("chat").push({ user: user.name, img: e.target.result });
    reader.readAsDataURL(input.files[0]);
}

function setMode(m) {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-'+m).classList.add('active');
    document.querySelector('.input-area').style.display = (m === 'links') ? 'none' : 'flex';
    let screen = document.getElementById("screen");
    screen.innerHTML = "";
    db.ref(m).limitToLast(50).on("child_added", s => {
        let d = s.val();
        let div = document.createElement("div"); div.className = "msg";
        if(d.img) {
            div.innerHTML = `<b style="color:var(--main)">${d.user}:</b><br><img src="${d.img}" class="chat-img" onclick="showFullImg('${d.img}')">`;
        } else {
            let content = d.msg.startsWith("http") ? `<a href="${d.msg}" target="_blank" style="color:#3498db; text-decoration:underline;" oncontextmenu="copyText('${d.msg}'); return false;">${d.msg}</a>` : d.msg;
            div.innerHTML = `<b style="color:var(--main)">${d.user}:</b> ${content}`;
        }
        screen.appendChild(div);
        screen.scrollTop = screen.scrollHeight;
    });
}

function showFullImg(src) {
    document.getElementById("fullImg").src = src;
    document.getElementById("modal").style.display = "flex";
}

function copyText(text) {
    navigator.clipboard.writeText(text);
    let t = document.getElementById("toast");
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 2000);
}

setMode('chat');
</script>
</body>
    </html>
